# Expanded site registry generated from the operator profile.
# Focus: senior/staff backend and distributed-systems roles in Rust/Go,
# payments/settlement/fintech, crypto/protocol infrastructure, observability,
# search/retrieval/vector databases, and remote-friendly infrastructure teams.
# Generated from the provided CV and example registry format on 2026-07-06.
#
# Notes:
# - Single-company ATS/API boards generally enumerate the whole public board.
# - Aggregators, search pages, ecosystem boards and portfolio boards are marked
#   enumerates_all:false unless the feed explicitly returns all active jobs.
# - Hints intentionally describe parsing shape and domain fit without leaking
#   host-side admission thresholds.


- slug: gitlab
  name: "GitLab"
  url: https://boards-api.greenhouse.io/v1/boards/gitlab/jobs?content=true
  render: static
  company: "GitLab"
  hints: >-
    Greenhouse board API, token `gitlab`. Whole board in one GET. Each job has stable `id`,
    `title`, flattened `location.name`, `absolute_url`, `updated_at`, and `content` = full
    HTML-ENTITY-ESCAPED description. Use html.unescape, then strip tags. No salary or
    employment_type fields. Strong match for remote backend, platform, infrastructure and
    security roles.

