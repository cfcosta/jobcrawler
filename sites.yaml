- slug: startup_jobs
  name: "Startup Jobs"
  url: https://startup.jobs/roles/software-engineer/remote?page=2
  render: static
  enumerates_all: false
  hints: >-
    Startup.jobs is a large multi-company aggregator (Rails/Hotwire + Stimulus, Algolia-
    backed search), not a standard ATS. The whole site sits behind a Cloudflare managed
    challenge: a bare curl 403s ("Just a moment…"), but sending a full browser header set
    (Accept, Accept-Language, sec-ch-ua, sec-ch-ua-mobile, sec-ch-ua-platform, Sec-Fetch-
    Dest/Mode/Site/User, Upgrade-Insecure-Requests) returns HTTP 200 real HTML with curl
    alone — no browser. Crawl the filtered listing /roles/software-engineer/remote?page=N:
    pages N>=2 server-render 21 job cards each, but page 1 and the bare URL render results
    client-side via Algolia and emit zero job links, so start at page=2 and follow the `<a
    rel="next" data-infinite-scroll-target="nextPageLink" href="…?page=N+1">` until it
    disappears. Each card exposes data-post-template-target fields — title (with
    target=_blank href to the detail page /<slug>-<company>-<id>), companyName (+
    /company/<slug>), companyLogo, location (/locations/…), workplaceRemote/workplaceHybrid,
    and a `<time datetime>` timestamp; roughly 8 of the 21 cards per page are Pro-locked
    (title/company/apply hidden), so expect ~13 public jobs per page and no salary at card
    level. Fetch each detail page (same headers) and parse its single `<script
    type="application/ld+json">` JobPosting — clean JSON, NOT entity-escaped so json.loads
    works directly, giving title, hiringOrganization{name, sameAs, logo},
    baseSalary{currency, value.minValue/maxValue, unitText=YEAR}, employmentType,
    datePosted, validThrough, jobLocation.address, applicantLocationRequirements,
    jobLocationType (TELECOMMUTE=remote), occupationalCategory (SOC code), and a Trix-HTML
    description (strip tags). For fuller enumeration robots.txt exposes
    https://startup.jobs/sitemap.xml.gz → posts.xml.gz + posts1-5.xml.gz (every job detail
    URL with lastmod) and roles.xml.gz (all /roles/<slug>[/remote] listings). Strong fit for
    remote software-engineering roles across startups.

- slug: jobspresso
