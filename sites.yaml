    `boardType`:RIPPLING, `boardURL`) plus `filtersConfig` (departments/workLocations).
    Build per-job links as `https://ats.rippling.com/moov/jobs/<jobId>` (apply at
    `.../jobs/<jobId>/apply`). Gotcha: SSR only dehydrates page 0 (first 20 postings), so if
    `totalItems` exceeds pageSize you must page the live client XHR keyed
    `["board","moov","job-posts"]`; at capture the board was EMPTY (totalItems 0), so item
    field names weren't observable. Good fit for payments/fintech backend, platform, and
    infrastructure engineering roles.

