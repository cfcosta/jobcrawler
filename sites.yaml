# The site registry (§4.1) — the system's checked-in input.
# One entry per source; `jobcrawl run` schedules these and `jobcrawl generate`
# writes a crawler per slug into src/jobcrawler/crawlers/<slug>.py.
#
# Fields:
#   slug          stable id — names crawlers/<slug>.py and the `source` on every
#                 Job; must be a valid Python identifier (underscores, no hyphens).
#   name          human label for `jobcrawl list` / status.
#   url           the endpoint/page the crawler starts from. It also fixes the
#                 SSRF host allowlist (fetches must stay on this host), so it
#                 points straight at the ATS API host where there is one. A
#                 generated crawler may widen its own allowlist only through an
#                 EXTRA_HOSTS declaration admitted against site-served evidence
#                 (§6 gate-1(b) / §8) — never through this registry field.
#   render        max fetch tier (auto|static|browser|solver, §4.10). All the
#                 sources below are plain JSON/RSS, so `static` (no browser).
#   hints         free-text steer for the generator — the probe-verified shape of
#                 the feed (endpoint, which field holds the full description, id
#                 location, quirks). No host-side gate/threshold is ever leaked.
#   company       OPTIONAL. A single-company board (one employer's roles, and the
#                 ATS feed carries no per-posting company) — the generator stamps
#                 this onto every Job. Omit it for a multi-company aggregator,
#                 where each posting already names its own employer.
#   enumerates_all  OPTIONAL, default true. True ⇒ one crawl sees the WHOLE board,
#                 so the §4.7 close-missing diff may close any URL that vanished.
#                 False ⇒ the source shows only a recent WINDOW (an RSS feed, or
#                 RemoteOK's latest ~100); the diff is unsound there (a role that
#                 merely aged out of the window is not closed), so closure defers
#                 to the §4.9 recheck loop (expires_at / expired-markers).
#   schedule / adaptive / enabled  cadence + on-off (see schedule.Site). Left
#                 unpinned below, so each inherits the fleet adaptive default
#                 (§4.9 JOBCRAWLER_ADAPTIVE_DEFAULT) — the hit-rate controller
#                 paces each source on its own churn.
#
# All endpoints below were probe-verified 2026-07-02.

