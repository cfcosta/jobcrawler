    Feed for Node.js</generator>`) — whole board in one GET, enumerates every posting. Parse
    under the `http://www.w3.org/2005/Atom` namespace: each `<entry>` carries `<title
    type="html">` (CDATA) = role name, `<id>` and `<link href>` = the `/careers/<slug>`
    detail URL, `<updated>` = ISO-8601 timestamp, and `<content type="html">` (CDATA) = the
