    `a.w-job-card__link@href` (→ `/job/<slug>/`), `h3.w-job-card__title`, company in
    `p.w-job-card__company > strong`, a `w-region-chip` (flag emoji + region text like
    "Remote US"), a `w-tag--<type>` chip (e.g. "Full Time"), a relative posted date, and
    category in `w-job-card__type`; titles are HTML-entity-escaped (`&#038;`, `&#8211;`) so
    html.unescape. For full data fetch the static detail page, which carries two
    `application/ld+json` JobPosting blocks (title, HTML description, datePosted,
    validThrough, hiringOrganization{name,sameAs,logo}, jobLocationType=TELECOMMUTE,
    applicantLocationRequirements/jobLocation.address); the real external apply URL —
    straight to the employer ATS (e.g. Greenhouse/Lever) — is the `a.w-btn-
    lg[target=_blank]` "Apply for this job" link inside `div.w-single-job__cta`. No salary
    field is present. Broad remote-work aggregator spanning marketing, product, software
    engineering, finance and customer-success roles.

- slug: ycombinator_jobs
