# -----------------------------------------------------------------------------
# Crypto/Web3 aggregators and ecosystem boards.
# -----------------------------------------------------------------------------
- slug: myweb3jobs
  name: MyWeb3Jobs
  url: https://myweb3jobs.com/wp-json/wp/v2/job
  render: static
  hints: >-
    WordPress REST API. Page with ?per_page=100&page=N until page exceeds
    X-WP-TotalPages; this bounded walk enumerates the whole board. Trim payload
    with &_fields=id,link,date_gmt,title,content,acf. content.rendered is full
    HTML description; title.rendered is HTML-entity-escaped; link is url; id is
    external_id; date_gmt is posted_at UTC. acf.company_name, acf.location,
    acf.remote, acf.employment_type, salary fields and acf.apply_url_or_email
    enrich when non-empty. Useful for crypto/backend/protocol roles.

- slug: web3career
  name: Web3.career
  url: https://web3.career/
  render: static
  enumerates_all: false
  hints: >-
    Crypto job aggregator. Windowed crawl: fetch newest-first listing ?page=1
    and optionally ?page=2; do not walk the huge historical sitemap. Each listing
    links to /<slug>/<id>; fetch details and parse schema.org JobPosting ld+json
    for title, hiringOrganization.name, jobLocation, full HTML description,
    datePosted, validThrough, baseSalary, employmentType and jobLocationType.
    external_id = trailing integer in the detail path. Use browser User-Agent.

- slug: cryptojobslist
  name: CryptoJobsList
  url: https://cryptojobslist.com/sitemap-jobs.xml
  render: static
  enumerates_all: false
  hints: >-
    Crypto job aggregator, Next.js. Windowed crawl: GET sitemap-jobs.xml, sort
    /jobs/<slug> URLs by <lastmod> descending and fetch only the freshest slice.
    Detail pages carry schema.org JobPosting in the ld+json @graph array: title,
    hiringOrganization.name, location, full HTML description, url, datePosted,
    validThrough, baseSalary, employmentType[] and jobLocationType. external_id =
    /jobs/ slug. Use browser User-Agent.

- slug: sailonchain
  name: SailOnchain
  url: https://sailonchain.com/
  render: static
  enumerates_all: false
  hints: >-
    Crypto job aggregator, Next.js App Router. Windowed crawl: homepage embeds a
    Latest Crypto Jobs ItemList; take those /jobs/<slug> links or the freshest
    slice from /sitemaps/jobs.xml, then fetch details. Detail JobPosting ld+json
    is HTML-ENTITY-ESCAPED; html.unescape before json.loads. Parse title,
    hiringOrganization.name, jobLocation/applicantLocationRequirements,
    description, url, identifier.value, datePosted, validThrough, baseSalary,
    employmentType and jobLocationType. Do not fetch robots-disallowed ?_rsc URLs.

- slug: solana
  name: Solana Ecosystem Jobs
  url: https://jobs.solana.com/
  render: static
  enumerates_all: false
  hints: >-
    Getro-platform board for Solana ecosystem companies. Windowed crawl: GET
    /sitemap.xml, sort /companies/<org>/jobs/<id>-<slug> URLs by <lastmod>
    descending, fetch only the freshest slice, and read each posting from
    __NEXT_DATA__ → props.pageProps.initialState.jobs.currentJob. Fields: title,
    full HTML description, organization.name, locations[].name, postedAt,
    expiresAt, employmentTypes[], compensation*Cents/currency/period when
    present. Job.url = board detail URL; currentJob.url = apply_url;
    external_id = numeric id prefix; skip status != active. Never fetch
    api.getro.com.

- slug: arbitrum
  name: Arbitrum Ecosystem Jobs
  url: https://jobs.arbitrum.io/
  render: static
  enumerates_all: false
  hints: >-
    Getro-platform board for Arbitrum ecosystem companies. Windowed crawl: GET
    /sitemap.xml, sort /companies/<org>/jobs/<id>-<slug> URLs by <lastmod>
    descending, fetch only the freshest slice, and parse detail pages from
    __NEXT_DATA__ → props.pageProps.initialState.jobs.currentJob. Fields follow
    the Solana Getro pattern: title, full HTML description, organization.name,
    locations[].name, postedAt/expiresAt, employmentTypes[], compensation cents
    when present, status, and external ATS URL. Skip inactive jobs. Never fetch
    api.getro.com.

- slug: coinbase_portfolio
  name: Coinbase Ventures Portfolio Jobs
  url: https://coinbase.getro.com/
  render: static
  enumerates_all: false
  hints: >-
    Getro-platform board for Coinbase Ventures portfolio companies. Windowed
    crawl: GET /sitemap.xml, sort job URLs by <lastmod> descending and fetch only
    the freshest slice. Detail pages embed currentJob in __NEXT_DATA__ using the
    standard Getro shape: title, full description, organization.name,
    locations[].name, postedAt/expiresAt, employmentTypes[], compensation cents
    when present, status, and external apply URL. Skip inactive jobs. Never fetch
    api.getro.com. Strong source for crypto, payments, infra and protocol roles.
