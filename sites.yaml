    stable `id`, `title`, flattened `location.name`, `absolute_url`,
    `updated_at`, and `content` = full HTML-ENTITY-ESCAPED description. Use
    html.unescape, then strip tags. No salary or employment_type fields.
    Strong match for remote backend, platform, infrastructure and security roles.

