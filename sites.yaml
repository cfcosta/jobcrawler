# -----------------------------------------------------------------------------
# Multi-company remote/general aggregators.
# These usually show a recent window only, so enumerates_all:false.
# -----------------------------------------------------------------------------
- slug: remoteok
  name: RemoteOK
  url: https://remoteok.com/api
  render: static
  enumerates_all: false
  hints: >-
    RemoteOK JSON returns only the latest ~100 posts, so enumerates_all:false.
    SKIP element[0], a legal-notice object. Use a browser-like User-Agent.
    `salary_min`/`salary_max` keys are always 0; ignore them and leave the salary
    quartet None unless host-side salary parsing reads pay from description. Each
    post names its own `company`; stable id in `id`, canonical link in `url`,
    epoch `date` = posted_at. Useful for remote backend, Rust, Go, crypto,
    fintech, DevOps and infra roles.

