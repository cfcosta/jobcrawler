# -----------------------------------------------------------------------------
# Custom company boards. These are selected because their current openings are
# highly aligned, but their public boards are not simple Greenhouse/Ashby/Lever
# endpoints. Most are treated as windowed to avoid false close-missing diffs.
# -----------------------------------------------------------------------------
- slug: stripe
  name: Stripe
  url: https://stripe.com/jobs/search
  render: static
  company: Stripe
  enumerates_all: false
  hints: >-
    Stripe jobs search is a custom server-rendered board. Windowed crawl: fetch
    the jobs search page and filter detail links under /jobs/listing/. For each
    detail page, extract title, location, team/category, full job-body text,
    application link, and external_id from the trailing numeric id in the URL.
    Treat as windowed because search filters/pagination can change. Strong match
    for payments, payouts, crypto, risk, ledgering, APIs and backend platform
    roles.

