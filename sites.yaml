# The site registry (§4.1) — the system's checked-in input.
# One entry per site; `autocrawl run` schedules these and `autocrawl generate`
# writes a crawler per slug into src/bizup_autocrawler/crawlers/<slug>.py.
#
# fields: slug (stable id, names the crawler + the source on items), name,
#   url (root/section), render (auto|static|browser|solver max tier, §4.10),
#   hints (free-text steer for the generator), schedule (30m|6h|cron; else the
#   global default), enabled (crawl on/off without deleting).

- slug: example
  name: Example News
  url: https://example.com/news
  render: auto
  enabled: true

- slug: valor_globo
  name: Valor — Globo
  url: https://valor.globo.com/
  render: auto
  hints: Brazilian financial news; articles live under sections like /financas, /empresas, /brasil.
  enabled: true

- slug: brazil_journal
  name: Brazil Journal
  url: https://braziljournal.com/
  render: auto
  hints: >-
    WordPress site, no paywall. Use the WordPress REST API ONLY — do NOT parse RSS.
    GET https://braziljournal.com/wp-json/wp/v2/posts?per_page=100&page=N as JSON
    for N=1,2,3 (stop early when a page returns an empty list or errors). Parse with
    json. For each post object: url = post["link"], title = post["title"]["rendered"],
    body = post["content"]["rendered"] with HTML tags stripped to plain text.
    content.rendered is the FULL article body (not an excerpt).
  enabled: true

