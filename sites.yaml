    render:static) and read `__appData.posting.descriptionHtml`/`descriptionPlainText` plus
    `compensationTiers`/`scrapeableCompensationSalarySummary`. Pure-JSON alternative: POST
    https://jobs.ashbyhq.com/api/non-user-graphql?op=ApiJobBoardWithTeams with
    {variables:{organizationHostedJobsPageName:"toggl"}}. Remote-first EU company; strong
    fit for remote engineering / product / data / platform roles.

