# Shape: jobs[] with id/title/location.name/absolute_url/updated_at/content.
# `content` is HTML-entity-escaped; html.unescape it, then strip tags.
# Greenhouse has no salary/employment_type fields in this API.
# -----------------------------------------------------------------------------
- slug: gitlab
  name: GitLab
  url: https://boards-api.greenhouse.io/v1/boards/gitlab/jobs?content=true
  render: static
  company: GitLab
  hints: >-
