    escaped — pull it out of CDATA, then strip tags, discarding the many inline anchor-link
    `<svg>` blocks). There are no structured `location`, `baseSalary`, or `employmentType`
    fields anywhere; Oxide is remote-first US (workday overlapping Pacific Time), and any
    location constraint (e.g. "candidates located in the Midwest") lives only in the
    description prose. Detail HTML pages carry no ld+json JobPosting, so the feed is
    strictly the better source. Strong match for deep systems / Rust roles: OS kernel, host
    virtualization, control-plane and networking software, plus performance, field-delivery,
    solutions and revenue-ops.

