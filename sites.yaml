- slug: chainlink_labs
  name: "Chainlink Labs"
  url: https://jobs.ashbyhq.com/chainlink-labs
  render: static
  company: "Chainlink Labs"
  hints: >-
    Ashby HOSTED board — the org has the public posting API disabled
    (api.ashbyhq.com/posting-api/job-board/chainlink-labs is HTTP 404 under every token;
    do NOT use it), but the hosted pages embed everything server-side, so plain static
    GETs work. LISTING: GET https://jobs.ashbyhq.com/chainlink-labs — the HTML carries an
    inline `window.__appData = {...}` JSON literal; parse it (json.JSONDecoder().raw_decode
    on the text after `window.__appData = `) and read `jobBoard.jobPostings[]` (~24 roles,
    all teams). Each posting has `id`, `jobId`, `title`, `teamName`, `locationName`,
    `secondaryLocations`, `workplaceType` (Remote/Hybrid), `employmentType`,
    `publishedDate`, `compensationTierSummary`. DETAIL/description: GET
    https://jobs.ashbyhq.com/chainlink-labs/<id> using the posting `id` (NOT `jobId` —
    that shape returns an empty shell); its `__appData.posting` object carries
    `descriptionPlainText`/`descriptionHtml` (~7k chars), `isRemote`,
    `secondaryLocationNames`, and `scrapeableCompensationSalarySummary`. Apply url:
    https://jobs.ashbyhq.com/chainlink-labs/<id>/application. Strong match for
    decentralized oracle infrastructure, blockchain protocols, on-chain finance,
    cryptography-adjacent backend, distributed systems and remote protocol engineering
    roles. Keep EXTRA_HOSTS empty — listing and details live on the registry host.

