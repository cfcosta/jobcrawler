    `/jobs/l/<role>` for the 10 known roles — software-engineer, designer, recruiting,
    science, product-manager, operations, sales-manager, marketing, legal, finance — each a
    curated ~14-29 job slice; parse by extracting the HTML-ENTITY-ESCAPED `data-page`
    attribute (html.unescape then json.loads, read `props.jobs`), or send `X-Inertia: true`
    + `X-Inertia-Version: <hash from data-page>` to get the same JSON directly (a stale
    version 409s with an `X-Inertia-Location` header). (2) `/jobs/search?q=<query>` returns
    plain `{"jobs":[...]}` with no special headers — a semantic/keyword search good for
    arbitrary terms. Each job has `id`, `title`, `jobType` (Fulltime/…), free-text
    `location` (often `City, ST, CC / … / Remote`), `roleType` (Backend/Full stack/ML/…),
    `salary` (human string like `$124K - $188K CAD` or null), `companyName`, `companySlug`,
    `companyBatch` (e.g. `S11`), `companyOneLiner`, `companyLogoUrl`, and `applyUrl`
