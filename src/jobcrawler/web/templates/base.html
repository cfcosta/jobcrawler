<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Position tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset('app.css') }}">
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a class="brand" href="/">jobcrawler</a>
      <a class="{{ 'active' if nav == 'dashboard' else '' }}" href="/">Dashboard</a>
      <a class="{{ 'active' if nav == 'positions' else '' }}" href="/positions">Positions</a>
    </nav>
    <form class="search" method="get" action="/positions" role="search">
      <input type="search" name="q" placeholder="Search title, company, location…"
             value="{{ filters.q if filters else '' }}">
      <button type="submit">Search</button>
    </form>
    <form class="rescore" method="post" action="/rescore">
      <button type="submit" title="Requeue every open position for the daemon to rescore">Rescore all</button>
    </form>
  </header>

  {% if msg %}<div class="flash" role="status">{{ msg }}</div>{% endif %}

  <main class="content {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    USD salary estimates use exchange rates
    <a href="https://www.exchangerate-api.com" rel="noopener">powered by Exchange Rate API</a>.
  </footer>

  <script src="{{ asset('app.js') }}" defer></script>
</body>
</html>
