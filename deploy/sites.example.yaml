# bizup-autocrawler site registry (§4.1) — the system's checked-in input.
# Copy to your state dir as sites.yaml and replace with your real seed list.
#
# fields:
#   slug     stable id — names the crawler file and the `source` on ingested items.
#   name     human label.
#   url      root or section page the crawler starts from.
#   render   max fetch tier: auto | static | browser | solver (§4.10). `auto` lets
#            the generator pick the cheapest tier that works; `solver` needs
#            AUTOCRAWLER_SOLVER + a backend configured.
#   hints    free-text steer for the generator (section paths, language, layout).
#   schedule per-site cadence — a duration (e.g. 30m | 6h | 1d), or `adaptive` to
#            let the §4.9 hit-rate controller learn the cadence from how often the
#            source actually posts (bounded by AUTOCRAWLER_MIN_SCHEDULE /
#            AUTOCRAWLER_MAX_SCHEDULE, tuned by AUTOCRAWLER_ADAPTIVE_TARGET_N).
#            Omit to use the fleet default, which is adaptive
#            (AUTOCRAWLER_ADAPTIVE_DEFAULT defaults true); set it false to fall back
#            to the fixed AUTOCRAWLER_DEFAULT_SCHEDULE (30m). (Cron expressions are
#            not supported yet and are rejected.)
#   adaptive equivalently, `adaptive: true` (the `schedule: adaptive` shorthand
#            just sets this and clears the fixed cadence).
#   enabled  crawl on/off without deleting the entry.

- slug: example
  name: Example News
  url: https://example.com/news
  render: auto
  schedule: 30m
  enabled: true

