# A single-company Lever board. NOTE: api.lever.co/v0/postings/<token>?mode=json —
# the `description` field is the INTRO ONLY; the full text is
# description + lists[].content + additional. workplaceType is always present
# (remote/hybrid/onsite); categories.{location,team,commitment}; no company field
# (so set `company:`). Whole board in the response ⇒ enumerating (default true).
# - slug: example_lever
#   name: Example Co — Jobs
#   url: https://jobs.lever.co/example
#   company: Example Co
#   render: auto
#   hints: >-
#     Lever board, token `example`, api.lever.co/v0/postings/example?mode=json.
#     Full description = description + lists[].content + additional (the top-level
#     description is just the intro). Use workplaceType for remote/hybrid/onsite.
#   enabled: true

# A multi-company aggregator that only exposes a recent window — enumerates_all
# MUST be false so the closure diff is skipped (the recheck loop covers it). Its
# /api returns only the latest ~100 postings, element[0] is a legal-notice object
# to skip, it needs a browser-like UA, and its salary keys are always 0. Each
# posting carries its own company, so DON'T set `company:` here.
# - slug: remoteok
#   name: RemoteOK
#   url: https://remoteok.com/api
#   render: browser
#   enumerates_all: false
#   hints: >-
#     JSON at /api, latest ~100 only (partial — hence enumerates_all: false). Skip
#     element[0] (a legal notice). Needs a browser-like User-Agent. Ignore the
#     salary_min/salary_max keys (always 0). Each item states its own company.
#   schedule: 12h
#   enabled: true
