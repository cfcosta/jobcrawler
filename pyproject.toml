[project]
name = "jobcrawler"
version = "0.1.0"
description = "RLM-based jobcrawler that generates and runs per-site news crawlers"
requires-python = ">=3.12"
dependencies = [
  "charset-normalizer>=3.3",
  "defusedxml>=0.7",
  "dspy>=3.2.1,<3.3",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.scripts]
jobcrawl = "jobcrawler.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ty>=0.0.49"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --import-mode=importlib"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]
# crawlers/ is the machine-owned artifact space: generated modules admitted by
# the §6 gates and executed in the §4.4 sandbox, not dev-typed code. A model
# writing e.g. `def crawl(ctx=None)` is runtime-fine (the daemon always passes
# ctx) but would churn `ty check` with every self-heal.
exclude = ["src/jobcrawler/crawlers/"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
